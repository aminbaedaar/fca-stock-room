# Daily database backup (the free Supabase plan has no automatic backups).
# Saves a full SQL dump as a downloadable file in GitHub Actions, kept 30 days.
# Needs the repository secret SUPABASE_DB_URL (see docs/SETUP.md, step 8).
name: Daily backup

on:
  schedule:
    - cron: '0 22 * * *' # 00:00 Kigali time
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Dump database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --schema=public --no-owner --no-privileges -f "fca-backup-$(date -u +%F).sql"
          gzip fca-backup-*.sql
      - uses: actions/upload-artifact@v4
        with:
          name: fca-backup
          path: fca-backup-*.sql.gz
          retention-days: 30
